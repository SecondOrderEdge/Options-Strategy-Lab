[project]
name = "options-strategy-lab"
version = "0.1.0"
description = "Options Strategy Lab — institutionally rigorous options analytics with explicit model-assumption labelling."
readme = "README.md"
requires-python = "==3.11.*"
license = { text = "MIT" }
authors = [{ name = "Options Strategy Lab" }]

# Core runtime dependencies. The library core (osl.*) must import cleanly
# with only these installed. Heavy/optional integrations live in extras.
dependencies = [
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<3.0",
    "pyarrow>=15.0",
    "pandera>=0.20",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "structlog>=24.1",
    "diskcache>=5.6",
    "pandas-market-calendars>=4.3",
    "requests>=2.31",
    "zstandard>=0.22",
]

[project.optional-dependencies]
# yfinance fallback provider.
data = [
    "yfinance>=0.2.40",
]
# Streamlit UI + interactive charts.
ui = [
    "streamlit>=1.36",
    "plotly>=5.22",
]
# Developer tooling: lint, type-check, test.
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "black>=24.4",
    "hypothesis>=6.100",
    "types-requests",
    "pandas-stubs",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["osl"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["osl", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pyflakes/pycodestyle
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "C4",            # comprehensions
    "SIM",           # simplify
    "RUF",           # ruff-specific
]
ignore = [
    "E501",  # line length handled by black
]

[tool.ruff.lint.isort]
known-first-party = ["osl"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

# ---------------------------------------------------------------------------
# Black
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py311"]

# ---------------------------------------------------------------------------
# mypy (strict on the library core)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
files = ["osl"]

[[tool.mypy.overrides]]
module = [
    "yfinance.*",
    "streamlit.*",
    "plotly.*",
    "diskcache.*",
    "pandas_market_calendars.*",
    "zstandard.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
markers = [
    "integration: tests that require live network / provider credentials",
]
filterwarnings = [
    "ignore::DeprecationWarning:pandera.*",
]
